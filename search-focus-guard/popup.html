<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Focus Guard</title>
    <style>
      body { width: 270px; margin: 0; padding: 14px; color: #222; font: 14px/1.4 Arial, sans-serif; }
      label { display: block; margin: 0 0 5px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; margin-bottom: 8px; padding: 7px; font: inherit; }
      button { width: 100%; padding: 9px; border: 0; border-radius: 5px; background: #1a73e8; color: white; cursor: pointer; font: inherit; }
      button:hover { background: #155fc0; }
      #save-search { margin-bottom: 8px; background: #5f6368; }
      #save-search:hover { background: #4b4f53; }
      p { margin: 10px 0 0; color: #555; font-size: 12px; }
      #status { min-height: 1.4em; }
    </style>
  </head>
  <body>
    <label for="default-search">Texto de búsqueda predeterminado</label>
    <input id="default-search" type="text" placeholder="Vacío = última búsqueda">
    <button id="save-search" type="button">Guardar texto</button>
    <button id="open-search" type="button">Buscar en esta página</button>
    <p>Atajo de Search Focus Guard: Ctrl + Shift + E</p>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
